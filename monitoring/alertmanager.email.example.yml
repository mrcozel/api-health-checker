# Copy to the ignored monitoring/alertmanager.email.yml and edit the placeholders.
global:
  smtp_smarthost: smtp-relay.brevo.com:587
  smtp_from: verified-sender@example.com
  smtp_auth_username: YOUR_BREVO_SMTP_LOGIN
  smtp_auth_password_file: /run/secrets/smtp-password
  smtp_require_tls: true

route:
  receiver: email
  group_by: [alertname, endpoint_id, job, instance]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: your-recipient@example.com
        send_resolved: true
