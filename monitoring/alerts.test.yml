      "interval": "15s",
      "input_series": [
        {
          "series": "up{job=\"api-health-checker\",instance=\"dashboard:8000\"}",
          "values": "1x20"
        },
        {
          "series": "api_monitor_stale{job=\"api-health-checker\",instance=\"dashboard:8000\",endpoint=\"Sample\",endpoint_id=\"sample\"}",
          "values": "0x3 1x4 0x3"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "75s",
          "alertname": "CheckerOverdue",
          "exp_alerts": []
        },
        {
          "eval_time": "90s",
          "alertname": "CheckerOverdue",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "api-health-checker",
                "instance": "dashboard:8000",
                "endpoint": "Sample",
                "endpoint_id": "sample",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Monitoring observations are overdue",
                "description": "The endpoint has no check within its configured freshness limit. Current API health is unknown. Check the checker process and logs."
              }
            }
          ]
        },
        {
          "eval_time": "135s",
          "alertname": "CheckerOverdue",
          "exp_alerts": []
