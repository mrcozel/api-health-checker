apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: api-monitor
resources:
  - namespace.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: monitoring-config
    files:
      - endpoints.json
    literals:
      - CHECK_INTERVAL=60
      - TIMEOUT=5
images:
  - name: api-health-checker
    newName: api-health-checker
    newTag: local
