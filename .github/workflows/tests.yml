
name: API Health Checker Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run automated tests
        run: python -m unittest -v

      - name: Build container image
        run: docker build -t api-health-checker:test .

      - name: Run tests inside the container
        run: >-
          docker run --rm --volume "$PWD:/tests:ro" --workdir /tmp
          --env PYTHONPATH=/tests api-health-checker:test
          python -m unittest discover -s /tests -v

      - name: Verify real Prometheus scrape
        run: python monitoring/smoke_test.py
