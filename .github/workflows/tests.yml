
name: API Health Checker Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run automated tests
        run: python -m unittest -v

      - name: Build container image
        run: docker build -t api-health-checker:test .

      - name: Run tests inside the container
        run: >-
          docker run --rm --volume "$PWD:/tests:ro" --workdir /tmp
          --env PYTHONPATH=/tests api-health-checker:test
          python -m unittest discover -s /tests -v

      - name: Verify Prometheus scrape and Grafana provisioning
        run: python monitoring/smoke_test.py

      - name: Verify alert rules and firing/resolved email delivery
        run: python monitoring/alerting_smoke_test.py

      - name: Verify isolated monitoring volume backup and restore
        run: python monitoring/backup_smoke_test.py
